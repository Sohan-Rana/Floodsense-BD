[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodsense-bd"
version = "0.1.0"
description = "AI-powered flood risk forecasting and community early warning prototype for Bangladesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sohan Rana" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "folium>=0.15", "streamlit-folium>=0.18"]
dev = ["pytest>=7.4"]

[project.scripts]
floodsense = "floodsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
